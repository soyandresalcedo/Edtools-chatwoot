# Railway.toml - Configuración optimizada para Chatwoot
# Basado en documentación oficial y mejores prácticas

[build]
builder = "nixpacks"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variables de entorno esenciales
[env]
# Rails configuration
RAILS_ENV = "production"
RACK_ENV = "production"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"
RAILS_MAX_THREADS = "5"

# --- Node---
NODE_ENV = "production"

# --- Docker ---
INSTALLATION_ENV = "docker"

# --- HEALTH---
healthcheckTimeout = 300
deployTimeout = 600

# Bundle configuration
BUNDLE_WITHOUT = "development:test"
BUNDLE_DEPLOYMENT = "true"

# Security and SSL
FORCE_SSL = "true"
ENABLE_ACCOUNT_SIGNUP = "true"

# Storage configuration
ACTIVE_STORAGE_SERVICE = "amazon"

# AWS S3 Configuration
# IMPORTANTE: Configura estas variables en Railway Dashboard > Variables:
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY  
# AWS_REGION
# S3_BUCKET_NAME

# Email configuration
MAILER_SENDER_EMAIL = "noreply@tudominio.com"

# Port configuration for Railway
PORT = "3000"

# pgvector fallback mode for Railway
RAILWAY_PGVECTOR_FALLBACK = "true"