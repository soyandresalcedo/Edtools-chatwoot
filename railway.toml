# Final check
# Configuración del build (compilación)
[build]
builder = "DOCKERFILE"

# Configuración del despliegue GENERAL
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# --- ¡LA MAGIA ESTÁ AQUÍ! ---
# --- Definición explícita de los servicios ---

# 1. Servicio WEB: Ejecuta script que construye URLs y inicia servidor
[[deploy.services]]
name = "web"
healthcheckPath = "/health"
healthcheckTimeout = 120
healthcheckInterval = 15
startCommand = "./bin/entrypoint-web.sh"

# 2. Servicio WORKER: Ejecuta script que construye URLs e inicia Sidekiq
[[deploy.services]]
name = "worker"
startCommand = "./bin/entrypoint-worker.sh"

# Variables de Entorno - AÑADE TU CLAVE AQUÍ
[env]
RAILS_ENV = "production"
RACK_ENV = "production"
RAILS_LOG_TO_STDOUT = "true"
RAILS_SERVE_STATIC_FILES = "true"
RAILS_MAX_THREADS = "5"
BUNDLE_WITHOUT = "development:test"
BUNDLE_DEPLOYMENT = "true"
FORCE_SSL = "true"
ENABLE_ACCOUNT_SIGNUP = "true"
ACTIVE_STORAGE_SERVICE = "local"
MAILER_SENDER_EMAIL = "noreply@tudominio.com"